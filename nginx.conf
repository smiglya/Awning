# Awning — static frontend on nginx.
#
# Two things this gets right that a naive SPA config gets wrong:
#
# 1. No blanket `try_files $uri /index.html`. That rule answers 200 for every
#    address that does not exist, which Search Console records as a soft 404 and
#    which lets typo URLs compete with the pages that matter. The build writes a
#    real file per route, so nginx serves files and falls through to a genuine
#    404 with a 404 status.
#
# 2. One canonical host. www redirects to the apex once, with 301, and http
#    redirects to https once. No redirect chains.

# ---------------------------------------------------------------- redirects

server {
    listen 80;
    listen [::]:80;
    server_name awning.nyc www.awning.nyc;
    return 301 https://awning.nyc$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.awning.nyc;

    ssl_certificate     /etc/letsencrypt/live/awning.nyc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/awning.nyc/privkey.pem;

    return 301 https://awning.nyc$request_uri;
}

# ------------------------------------------------------------------- site

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name awning.nyc;

    root /var/www/awning/dist;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/awning.nyc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/awning.nyc/privkey.pem;

    # --- security headers -------------------------------------------------
    add_header X-Content-Type-Options   "nosniff"                   always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options          "SAMEORIGIN"                always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

    # Content-Security-Policy.
    #   'unsafe-inline' for style-src is required: the prerendered HTML carries
    #   each animation's start state as an inline style attribute, and motion
    #   writes inline styles at runtime.
    #   media-src covers the hero video's CDN. Narrow this when the video moves
    #   to your own server.
    #   connect-src must list the API origin once the backend exists.
    add_header Content-Security-Policy "default-src 'self'; \
script-src 'self'; \
style-src 'self' 'unsafe-inline'; \
img-src 'self' data:; \
font-src 'self'; \
media-src 'self' https://d8j0ntlcm91z4.cloudfront.net; \
connect-src 'self'; \
frame-ancestors 'self'; \
base-uri 'self'; \
form-action 'self'" always;

    # --- caching ----------------------------------------------------------
    # Hashed assets are immutable; HTML must never be cached, or a deploy is
    # invisible to anyone who has already visited.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600" always;
    }

    # --- routes -----------------------------------------------------------
    # Explicit, so an unknown path cannot be answered with 200.
    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /work-map {
        add_header Cache-Control "no-cache" always;
        try_files /work-map/index.html =404;
    }

    # trailing-slash variant, redirected rather than duplicated
    location = /work-map/ {
        return 301 https://awning.nyc/work-map;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Serve pre-compressed files if you add the brotli module:
    # brotli_static on;
}
