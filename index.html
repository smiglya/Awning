<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <!-- PNG, and the type says so. The supplied file arrived named .svg while
         being a Figma raster export; serving it as image/svg+xml is how a
         favicon renders as nothing in the browsers that check. -->
    <link rel="icon" href="/favicon.png" type="image/png" sizes="271x293" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Still Google-hosted. src/fonts.css holds the self-hosted @font-face
         rules, ready to swap in as soon as public/fonts/*.woff2 are in place —
         that removes a render-blocking third-party request and stops handing
         visitor IPs to Google, which matters once EU traffic is in scope. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- The prerendered HTML carries each animation's start state as an inline
         style, so without JavaScript the page would render invisible. This
         undoes it for that case only; with JS the styles are authoritative and
         motion animates from them as designed. -->
    <noscript>
      <style>
        [style*='opacity:0'] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>

    <title>Awning — websites for local NYC businesses</title>
    <meta
      name="description"
      content="Turnkey websites for New York local business. $999 flat, paid once. Live 48 hours after the brief."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
