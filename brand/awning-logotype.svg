<!-- Awning logotype: the mark and the name as one lockup.

     Changed from the Figma export in three ways, none of which touch a path:

     1. The frame clipPath is gone. It cropped at height 347.7 while the g's
        descender reaches 353.02, so it shaved the tail flat.
     2. The viewBox is tight to the ink (0 0 1021.39 353.03). The export was
        1151 wide against 1021.39 of drawing — 130 units of empty space on the
        right, which reads as a phantom margin anywhere the lockup is aligned
        or centred, and it is worst in a small navigation bar.
     3. fill is currentColor, so the lockup inherits from CSS and works on both
        paper and ink without a second copy.

     Source of truth: mirrored as JSX in src/components/Brand.tsx and rasterised
     into the Open Graph card by scripts/make-images.mjs. -->
