<!-- Awning logotype, flat: the mark, then the name as drawn letters.

     Generated by scripts/make-logotype.mjs — edit that, not this. Every letter
     is constructed there from one metric system, so all five share a baseline,
     an x-height and a stem width by construction rather than by correction.

     The i is a key: ring bow, three stepped teeth, blade. The studio sells
     turnkey websites, and this is where that sits in the logo, not the copy.
     src/components/icons.tsx redraws that bit as pixel art, module for module.

     This is the variant for navigation, the prerender and our own rasteriser:
     no defs, no mask, no gradient, no filter, no stroke, absolute commands
     only. viewBox is tight to the ink so no empty space travels with the
     artwork, and fill is currentColor so it reverses out of a dark surface. -->
