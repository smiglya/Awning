<!-- The letter i, drawn as a key: tittle for the bow, a jagged bit, and a
     blade on a flat foot. Supplied artwork — lifted out of the logotype export
     awning-bit-jag-4t, translated so the ink starts at the origin, and otherwise
     untouched. Edit this file to change the key.

     Read by scripts/make-logotype.mjs, which scales it so its x-height matches
     the rest of the lowercase and sets it on the shared baseline. Those two lines
     cannot be recovered from the outline — the tittle sits above the x-height and
     nothing marks the baseline — so they are recorded here and restated in the
     generator:

       baseline      y = 205.92
       x-height top  y = 63.072   (x-height 142.848)

     Three separate paths rather than one with three subpaths. The bit and the
     blade overlap, and the two fill rules disagree about what an overlap inside a
     single path means: nonzero fills it, even-odd punches a hole. Split apart,
     they are a union under either rule, which is one fewer thing to get wrong in
     a renderer that is not a browser. -->
